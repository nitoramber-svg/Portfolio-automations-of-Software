[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-ductos"
version = "1.0.0"
description = "Real-time detection and location of illegal fuel taps on pipelines from SCADA pressure and flow data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # the core runs on the standard library alone

[project.optional-dependencies]
opcua = ["asyncua>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
sentinela = "sentinela.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinela*"]

[tool.setuptools.package-data]
sentinela = ["datos/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
